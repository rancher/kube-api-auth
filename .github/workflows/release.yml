name: CI Build And Publish Release

on:
  push:
    tags:
      - 'v*-rc.*'
  release:
    types:
      - published

permissions:
  contents: read

env:
  IMAGE: rancher/kube-api-auth

jobs:
  push:
    permissions:
      contents: read
      id-token: write # this is important, it's how we authenticate with Vault
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
        arch:
          - amd64
          - arm64
    steps:
      - name: Prepare Matrix Instance
        id: prepare
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          echo "PLATFORM_PAIR=$GOOS-$GOARCH"
          echo "PLATFORM_PAIR=$GOOS-$GOARCH" >> "$GITHUB_OUTPUT"
          echo "GOOS=$GOOS"
          echo "GOOS=$GOOS"     >> "$GITHUB_OUTPUT"
          echo "GOARCH=$GOARCH"
          echo "GOARCH=$GOARCH" >> "$GITHUB_OUTPUT"
          echo "ARCH=$GOARCH"
          echo "ARCH=$GOARCH"   >> "$GITHUB_OUTPUT"

      - name: Retrieve Docker Hub Credentials From Vault
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKERHUB_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKERHUB_PASSWORD

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Get Sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Docker Meta Data Setup
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Build and stage
        env:
          GOOS: ${{ steps.prepare.outputs.GOOS }}
          GOARCH: ${{ steps.prepare.outputs.GOARCH }}
        run: |
          ./scripts/build
          # Stage binary for packaging step
          cp -r ./bin/* ./package/

      - name: Resolve BCI base image
        id: bci
        run: |
          BASE_TAG=$(awk -F= '/^ARG BASE_IMAGE=/ {print $2; exit}' package/Dockerfile)
          [ -n "$BASE_TAG" ] || { echo "could not parse BASE_IMAGE from package/Dockerfile" >&2; exit 1; }
          DIGEST=$(docker buildx imagetools inspect "$BASE_TAG" \
            --format '{{.Manifest.Digest}}')
          REF=$(docker buildx imagetools inspect "$BASE_TAG" --format '{{json .Image}}' \
            | jq -er '[.[].config.Labels."org.opensuse.reference"] | unique
                | if length == 1 then .[0] else error("base image ref differs across platforms") end')
          echo "BASE_IMAGE=$REF"     >> "$GITHUB_OUTPUT"
          echo "BASE_DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build image and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: package
          file: package/Dockerfile
          platforms: ${{ matrix.os }}/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.bci.outputs.BASE_IMAGE }}
            BASE_DIGEST=${{ steps.bci.outputs.BASE_DIGEST }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ steps.prepare.outputs.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    permissions:
      contents: read
      id-token: write # this is important, it's how we authenticate with Vault
    runs-on: ubuntu-latest
    needs:
      - push
    steps:
      - name: Retrieve Docker Hub Credentials From Vault
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKERHUB_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKERHUB_PASSWORD

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.IMAGE }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  dispatch:
    name: Dispatch Rancher upgrade
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs:
      - push
      - merge
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Read App secrets
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/workflow-dispatcher/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/workflow-dispatcher/app-credentials privateKey | PRIVATE_KEY

      - name: Create App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: rancher
          repositories: rancher
          permission-actions: write

      - name: Determine Rancher refs from tag
        id: rancher-ref
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            v0.16.*) rancher_refs="main" ;;
            v0.15.*) rancher_refs="release/v2.15" ;;
            v0.13.*) rancher_refs="release/v2.14 release/v2.13" ;;
            v0.10.*) rancher_refs="release/v2.12 release/v2.11" ;;
            *) rancher_refs="notfound" ;;
          esac
          # note: release/v2.10 is end of life and not touched

          printf 'rancher_refs=%s\n' "$rancher_refs" >> "$GITHUB_OUTPUT"

      - name: Dispatch Kube-Api-Auth upgrade
        if: ${{ steps.rancher-ref.outputs.rancher_refs != 'notfound' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          for ref in ${{ steps.rancher-ref.outputs.rancher_refs }} ; do \
            gh workflow run "Kube Api Auth Upgrade" \
              --repo rancher/rancher \
              --ref "$ref" \
              -f kube_api_auth_version="${GITHUB_REF_NAME}" \
              -f source_author="${GITHUB_ACTOR}" \
              -f source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" ; \
          done

name: CI Build and Check

on:
  push:
    branches:
      - main
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANG_CI_LINT_VERSION: v2.12.2
  IMAGE: rancher/kube-api-auth

permissions:
  contents: read

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
    - name: Get Sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: false

    # https://github.com/golang/go/issues/75031
    - name: Set toolchain version
      run: go env -w GOTOOLCHAIN=go1.25.4+auto

    - name: Validate the sources
      run: |
        ./scripts/validate

    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: ${{ env.GOLANG_CI_LINT_VERSION }}

    - name: Test
      run: ./scripts/test

  rancher-sync:
    runs-on: ubuntu-latest
    steps:
    - name: Get Sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: true
        cache-dependency-path: scripts/rancher-sync.json

    - name: Check drift against rancher/rancher
      run: ./scripts/check-rancher-sync

  build:
    runs-on: ubuntu-latest
    needs:
      - linter
    strategy:
      fail-fast: false
      matrix:
        os:
          - linux
        arch:
          - amd64
          - arm64
    steps:
    - name: Prepare Matrix Instance
      id: prepare
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
      run: |
        echo "GOOS=$GOOS"
        echo "GOOS=$GOOS"     >> "$GITHUB_OUTPUT"
        echo "GOARCH=$GOARCH"
        echo "GOARCH=$GOARCH" >> "$GITHUB_OUTPUT"
        echo "ARCH=$GOARCH"
        echo "ARCH=$GOARCH"   >> "$GITHUB_OUTPUT"

    - name: Get Sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Determine Tag
      id: get-TAG
      run: |
        TAG=$(git describe --always)
        echo "TAG=$TAG"
        echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: 'go.mod'
        cache: false

    - name: Build
      env:
        GOOS: ${{ steps.prepare.outputs.GOOS }}
        GOARCH: ${{ steps.prepare.outputs.GOARCH }}
      run: |
        ./scripts/build
        echo Stage binary for packaging step
        cp -rv ./bin/* ./package/

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Resolve BCI base image
      id: bci
      run: |
        BASE_TAG=$(awk -F= '/^ARG BASE_IMAGE=/ {print $2; exit}' package/Dockerfile)
        [ -n "$BASE_TAG" ] || { echo "could not parse BASE_IMAGE from package/Dockerfile" >&2; exit 1; }
        DIGEST=$(docker buildx imagetools inspect "$BASE_TAG" \
          --format '{{.Manifest.Digest}}')
        REF=$(docker buildx imagetools inspect "$BASE_TAG" --format '{{json .Image}}' \
          | jq -er '[.[].config.Labels."org.opensuse.reference"] | unique
              | if length == 1 then .[0] else error("base image ref differs across platforms") end')
        echo "BASE_IMAGE=$REF"     >> "$GITHUB_OUTPUT"
        echo "BASE_DIGEST=$DIGEST" >> "$GITHUB_OUTPUT"

    - name: Package up into container image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: package
        push: false
        tags: ${{ env.IMAGE }}:${{ steps.get-TAG.outputs.TAG }}-${{ steps.prepare.outputs.ARCH }}
        file: package/Dockerfile
        build-args: |
          BASE_IMAGE=${{ steps.bci.outputs.BASE_IMAGE }}
          BASE_DIGEST=${{ steps.bci.outputs.BASE_DIGEST }}

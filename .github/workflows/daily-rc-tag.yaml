name: Daily RC Tag

on:
  schedule:
    # 8:00 UTC, all week, including weekends
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: main
            base-pattern: 'v0\.16\.'

          - ref: release/v0.15
            base-pattern: 'v0\.15\.'

          - ref: release/v0.13
            base-pattern: 'v0\.13\.'

          - ref: release/v0.10
            base-pattern: 'v0\.10\.'
    concurrency:
      group: daily-rc-tag-${{ matrix.ref }}
      cancel-in-progress: false
    steps:
      - name: Read GitHub token
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            github/token/rancher--kube-api-auth--contents--write token | APP_TOKEN

      - name: Checkout branch and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.APP_TOKEN }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure tagger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create tag when branch changed
        run: ./scripts/tag-rc-if-ref-changed "${{ matrix.base-pattern }}" origin "${{ matrix.ref }}"

      - name: Push tags
        run: git push --tags
